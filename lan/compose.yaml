services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: szero-lan-server:local
    restart: unless-stopped
    init: true
    ports:
      - "${SZERO_BIND_IP:-0.0.0.0}:${SZERO_PORT:-27150}:27150/tcp"
      - "${SZERO_BIND_IP:-0.0.0.0}:${SZERO_PORT:-27150}:27150/udp"
      - "${SZERO_BIND_IP:-0.0.0.0}:${ARENA_WEB_PORT:-8080}:8080/tcp"
      - "${ARENA_DB_BIND_IP:-0.0.0.0}:${ARENA_DB_PORT:-3306}:3306/tcp"
    environment:
      ARENA_ADMIN_TOKEN: "${ARENA_ADMIN_TOKEN:?Copy .env.example to .env and set ARENA_ADMIN_TOKEN}"
      ARENA_DB_PASSWORD: "${ARENA_DB_PASSWORD:?Set ARENA_DB_PASSWORD in .env}"
      ARENA_DB_EDITOR_PASSWORD: "${ARENA_DB_EDITOR_PASSWORD:?Set ARENA_DB_EDITOR_PASSWORD in .env}"
      ARENA_PUBLIC_URL: "${ARENA_PUBLIC_URL:-}"
    volumes:
      - ./server.example.json:/app/server.json:ro
      - server-logs:/logs
      - server-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  server-logs:
  server-data:
